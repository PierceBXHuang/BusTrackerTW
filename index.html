<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusTrackerTW</title>

    <!-- PWA -->
    <meta name="theme-color" content="#1976d2">
    <link rel="manifest" href="manifest.json">

    <!-- Icon -->
    <link rel="icon" type="image/jpeg" href="icons/appbus.jpg">
    <link rel="shortcut icon" href="icons/appbus.jpg">
    <link rel="apple-touch-icon" href="icons/appbus.jpg">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🚌 BusTrackerTW</h1>

    <!-- 查詢模式 -->
    <div class="modeArea">

        <label>
            <input
                type="radio"
                name="searchMode"
                value="select"
                checked>
            選單查詢
        </label>

        <label style="margin-left:20px">

            <input
                type="radio"
                name="searchMode"
                value="manual">

            手動輸入

        </label>

    </div>

    <br>

    <!-- 選單模式 -->
    <div id="selectMode">

        <input
            id="routeSearch"
            type="text"
            placeholder="🔍 搜尋路線...">

        <br><br>

        <select id="routeSelect">
            <option value="">請選擇路線</option>
        </select>

        <select id="startSelect" disabled>
            <option value="">請先選擇路線</option>
        </select>

        <select id="endSelect" disabled>
            <option value="">請先選擇路線</option>
        </select>

    </div>

    <!-- 手動模式 -->
    <div id="manualMode" style="display:none">

        <input
            id="routeInput"
            placeholder="公車路線，例如 606">

        <input
            id="startInput"
            placeholder="起點站">

        <input
            id="endInput"
            placeholder="終點站">

    </div>

    <button id="searchBtn">
        查詢
    </button>

    <button id="favoriteBtn">
        ⭐ 收藏
    </button>

    <div id="loading" style="display:none">
        查詢中...
    </div>

    <div id="error"></div>

    <div id="resultCard" style="display:none">

        <h2 id="routeName"></h2>

        <p id="destination"></p>

        <hr>

        <p>第一班：<span id="eta1">--</span></p>

        <p>第二班：<span id="eta2">--</span></p>

        <p>第三班：<span id="eta3">--</span></p>

        <hr>

        <small>
            更新時間：
            <span id="updateTime"></span>
        </small>

    </div>

    <h2>⭐ 我的收藏</h2>

    <div id="favoriteList"></div>

</div>

<script src="script.js"></script>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("sw.js")
            .then(() => console.log("✅ Service Worker 已註冊"))
            .catch(err => console.error("Service Worker 註冊失敗", err));

    });

}

</script>

</body>
</html>
